worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 100M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    server {
        listen     80;
        listen     [::]:80;

        # ── Kibana (catch-all) ────────────────────────────────────────────────
        # Must appear after more-specific location blocks.
        location / {
            proxy_pass         http://kibana:5601;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── DataApi (/smapi/) ─────────────────────────────────────────────────
        # DO NOT CHANGE path prefix
        location /smapi/ {
            rewrite            ^/smapi/(.*)$ /$1 break;
            proxy_pass         http://api:5000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── UiApi (/smuiapi/) ─────────────────────────────────────────────────
        # DO NOT CHANGE path prefix
        location /smuiapi/ {
            rewrite            ^/smuiapi/(.*)$ /$1 break;
            proxy_pass         http://ui-api:5001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Vue.js Vite dev server (/smpgui/) ────────────────────────────────
        # Replaces the static-file location used in production nginx.conf.
        # WebSocket upgrade is required for Vite HMR.
        # DO NOT CHANGE path prefix
        location /smpgui/ {
            proxy_pass         http://smpgui:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Vite HMR WebSocket (Vite uses /@vite/client and /vite-hmr by default)
        location /__vite_hmr {
            proxy_pass         http://smpgui:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ── Engagement deep-link rewrite ─────────────────────────────────────
        # DO NOT CHANGE
        location ~ "/s/[a-zA-Z-]*/app/smpgui/engagements/" {
            rewrite ^/s/[a-zA-Z-]*/app/smpgui/engagements/(.*)$ /smpgui/engagements/$1 redirect;
        }
    }
}
