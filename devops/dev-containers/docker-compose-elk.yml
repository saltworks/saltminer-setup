# Inspiration:
# https://www.elastic.co/guide/en/elastic-stack-get-started/7.17/get-started-docker.html#get-started-docker-tls
services:
  setup:
      image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:${STACK_VERSION}
      volumes:
        - certs:/usr/share/elasticsearch/config/certs
      user: "0"
      command: >
        bash -c '
          if [ x${ELASTIC_PASSWORD} == x ]; then
            echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
            exit 1;
          elif [ x${KIBANA_PASSWORD} == x ]; then
            echo "Set the KIBANA_PASSWORD environment variable in the .env file";
            exit 1;
          fi;
          if [ ! -f config/certs/ca.zip ]; then
            echo "Creating CA";
            bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
            unzip config/certs/ca.zip -d config/certs;
          fi;
          if [ ! -f config/certs/certs.zip ]; then
            echo "Creating certs";
            echo -ne \
            "instances:\n"\
            "  - name: es01\n"\
            "    dns:\n"\
            "      - es01\n"\
            "      - localhost\n"\
            "    ip:\n"\
            "      - 127.0.0.1\n"\
            "  - name: es02\n"\
            "    dns:\n"\
            "      - es02\n"\
            "      - localhost\n"\
            "    ip:\n"\
            "      - 127.0.0.1\n"\
            "  - name: es03\n"\
            "    dns:\n"\
            "      - es03\n"\
            "      - localhost\n"\
            "    ip:\n"\
            "      - 127.0.0.1\n"\
            > config/certs/instances.yml;
            bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
            unzip config/certs/certs.zip -d config/certs;
          fi;
          echo "Setting file permissions"
          chown -R root:root config/certs;
          find . -type d -exec chmod 750 \{\} \;;
          find . -type f -exec chmod 640 \{\} \;;
          echo "Waiting for Elasticsearch availability";
          until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
          echo "Setting kibana_system password";
          until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
          echo "All done!";
        '
      healthcheck:
        test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
        interval: 1s
        timeout: 5s
        retries: 120
      networks:
      - ${CONTAINER_NETWORK}

  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:${STACK_VERSION}
    container_name: es01
    hostname: es01
    environment:
    - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    - node.name=es01
    - cluster.name=${CLUSTER_NAME}
    - "${DISCOVERY_SEED_HOSTS:-ES_SM_NOSEEDHOSTS}=es02,es03"
    - "${CLUSTER_INITIAL_MASTER_NODES:-ES_SM_NOMASTERNODES}=es01,es02,es03"
    - ingest.geoip.downloader.enabled=false
    - bootstrap.memory_lock=true 
    - xpack.security.enabled=true
    - xpack.security.http.ssl.key=$CERTS_DIR/es01/es01.key
    - xpack.security.http.ssl.certificate_authorities=$CERTS_DIR/ca/ca.crt
    - xpack.security.http.ssl.certificate=$CERTS_DIR/es01/es01.crt
    - xpack.security.http.ssl.verification_mode=none
    - xpack.security.transport.ssl.enabled=true
    - xpack.security.transport.ssl.verification_mode=certificate
    - xpack.security.transport.ssl.certificate_authorities=$CERTS_DIR/ca/ca.crt
    - xpack.security.transport.ssl.certificate=$CERTS_DIR/es01/es01.crt
    - xpack.security.transport.ssl.key=$CERTS_DIR/es01/es01.key
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
    - data01:/usr/share/elasticsearch/data
    - certs:$CERTS_DIR
    ports:
    - 9200:9200
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    deploy:
      resources:
        limits:
          memory: 3gb
        reservations:
          memory: 500mb
    env_file:
    - es.env

  kibana:
    depends_on:
      es01:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana-wolfi:${STACK_VERSION}
    container_name: kibana
    hostname: kibana
    expose:
    - "5601"
    environment:
    - SERVERNAME=SaltMiner
    - ELASTICSEARCH_HOSTS=["https://es01:9200"]
    - ELASTICSEARCH_USERNAME=kibana_system
    - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    - SERVER_PUBLICBASEURL=${KIBANA_URL}
    volumes:
    - certs:/usr/share/kibana/config/certs
    - kibanadata:/usr/share/kibana/data
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:${ELASTIC_PASSWORD} http://kibana:5601/api/status | grep -q 'All services are available'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    deploy:
      resources:
        limits:
          memory: 2gb
        reservations:
          memory: 500mb
#    secrets:
#    - es-license
    command: >
        bash -c '
          if [ -f /run/secrets/es-license ]; then
            echo "Elasticsearch license present."
            curl -XPUT --cacert config/certs/ca/ca.crt -u elastic:${ELASTIC_PASSWORD} https://es01:9200/_license -H "Content-Type: application/json" -d @/run/secrets/es-license
          fi;
          /usr/local/bin/kibana-docker
        '

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      kibana:
        condition: service_started
    ports:
    - "80:80"
    volumes:
    - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"

volumes:
  certs:
    driver: local
  data01:
    driver: local
  kibanadata:
    driver: local

networks:
  saltminer:
    driver: bridge

