services:
  proxy:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_NGINX_IMAGE_VERSION}
    container_name: sm-nginx
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - type: bind
      source: ${INSTALL_PATH}/nginx/
      target: /opt/saltworks/saltminer/nginx/
#      read_only: true
    - smpgui-assets:/usr/share/saltworks/saltminer-3.0.0/ui-web
    #- .env:/usr/share/nginx/html/version/env.txt
    environment:
    - KIBANA_URL=${KIBANA_URL}
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    depends_on:
      ui-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 100mb
    command:
    - sh
    - -c
    - |
      if [ -f /nginx.conf ]; then
        echo 'Configuration file found.'
        cp /nginx.conf /etc/nginx/nginx.conf
        KIBANA_HOST=$$(echo ${KIBANA_URL} | awk -F'//' '{print $2}')
        echo "Host: $${KIBANA_HOST:=unknown}"
        sed -i -e "s#<your-kibana-url-here>#${KIBANA_URL}#g" /etc/nginx/nginx.conf
        sed -i -e "s#<your-kibana-HOST-name-here>#$${KIBANA_HOST:=unknown}#g" /etc/nginx/nginx.conf
      else
        echo 'Configuration file NOT found!'
      fi;
      nginx '-g' 'daemon off;'

  api:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_API_IMAGE_VERSION}
    container_name: api
    expose:
    - "5000"
    volumes:
    - type: bind
      source: ${INSTALL_PATH}/config/api/appsettings.json
      target: /appsettings.json
    - api-logs:/var/log/saltworks/saltminer
    #- type: bind
    #  source: ${INSTALL_PATH}/data-templates
    #  target: /data-templates
    environment:
    - ELASTIC_URL=${ELASTICSEARCH_URL}
    - KIBANA_URL=${KIBANA_URL}
    - ELASTIC_PWD=${ELASTIC_PASSWORD}
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:5000/utility/version | grep -q '\"success\":true'",
        ]
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 100mb
    entrypoint: []
    command:
    - sh
    - -c
    - |
      if [ -f /appsettings.json ]; then
        echo "Configuration file found."
        #cp /appsettings.json ${INSTALL_PATH}/ui-api/appsettings.json
        ./config-api.sh
      fi;
      #if [ "$(ls -A /data-templates/ingest-pipelines)" ]; then
      #  echo "Files exist in the ingest-pipelines directory."
      #  cp /data-templates/ingest-pipelines/*  /usr/share/saltworks/saltminer/api/data/ingest-pipelines/
      #else
      #  echo "No extra ingest pipelines to process."
      #fi;
      /usr/bin/dotnet /${INSTALL_PATH}/app/api/Saltworks.SaltMiner.DataApi.dll

  ui-api:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_UI_API_IMAGE_VERSION}
    container_name: ui-api
    hostname: ui-api
    expose:
    - "5001"
    volumes:
    - ui-files:/usr/share/saltworks/saltminer/ui-files
    - ui-api-logs:/var/log/saltworks/saltminer
    - type: bind
      source: ${INSTALL_PATH}/ui-api/appsettings.json
      target: /appsettings.json
      read_only: true
    environment:
    - KIBANA_URL=${KIBANA_URL}
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:5001/auth/cookie | grep -q '\"success\":true'",
        ]
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 100mb
    depends_on:
      api:
        condition: service_healthy
    entrypoint: []
    command:
    - sh
    - -c
    - |
      if [ -f /appsettings.json ]; then
        echo "Configuration file found."
        #cp /appsettings.json ${INSTALL_PATH}/ui-api/appsettings.json
        /scripts/config-ui-api.sh
      fi;
      /usr/bin/dotnet /usr/share/saltworks/saltminer/ui-api/Saltworks.SaltMiner.Ui.Api.dll

  sm-services:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_SERVICES_IMAGE_VERSION}
    container_name: services
    hostname: services
    volumes:
    - type: bind
      source: ${INSTALL_PATH}/agent/SourceConfigs
      target: ${INSTALL_PATH}/agent/SourceConfigs
    - type: bind
      source: ${INSTALL_PATH}/python/Elastic.json
      target: /Elastic.json
    - type: bind
      source: ${INSTALL_PATH}/python/saltworks.key
      target: ${INSTALL_PATH}-2.5.0/saltworks.key
    - type: bind
      source: ${INSTALL_PATH}/python/Sources
      target: ${INSTALL_PATH}-2.5.0/Sources
    - type: bind
      source: ${INSTALL_PATH}/servicemanager/ServiceManagerSettings.json
      target: ${INSTALL_PATH}/servicemanager/ServiceManagerSettings.json
    - type: bind
      source: /usr/share/saltworks/saltminer/python/Custom
      target: /usr/share/saltworks/saltminer-2.5.0/Custom
    - services-logs:/var/log/saltworks/saltminer
    - agent25-logs:/var/log/saltworks/saltminer-2.5.0
    - type: bind
      source: ${INSTALL_PATH}/manager/ManagerSettings.json
      target: ${INSTALL_PATH}/manager/ManagerSettings.json
    environment:
    - ELASTIC_URL=${ELASTICSEARCH_URL}
    - ELASTIC_PWD=${ELASTIC_PASSWORD}
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${SERVICES_MEMORY_LIMIT}
        reservations:
          memory: 100mb
    entrypoint: []
    command:
    - sh
    - -c
    - |
      if [ -f /Elastic.json ]; then
        echo "Python configuration file found."
        /usr/share/saltworks/saltminer/servicemanager/config-services.sh
      fi;
      if [ -d /usr/share/saltworks/saltminer-2.5.0/Custom ]; then
        echo 'Python custom directory exists.'
        find /usr/share/saltworks/saltminer-2.5.0/Custom -name '*.sh' | xargs dos2unix
      fi;
      /usr/bin/dotnet /usr/share/saltworks/saltminer/servicemanager/Saltworks.SaltMiner.ServiceManager.dll

  jobmanager:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_JOBMANAGER_IMAGE_VERSION}
    container_name: jobmanager
    hostname: jobmanager
    volumes:
    - type: bind
      source: ${INSTALL_PATH}/jobmanager/JobManagerSettings.json
      target: ${INSTALL_PATH}/jobmanager/JobManagerSettings.json
    - ui-files:/usr/share/saltworks/saltminer/ui-files
    - jobmanager-logs:/var/log/saltworks/saltminer
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    depends_on:
      api:
        condition: service_healthy
      ui-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 50mb

  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    container_name: elastic-agent
    hostname: ${ELASTIC_AGENT_HOSTNAME}
    restart: on-failure:10
    user: root # note, synthetic browser monitors require this set to `elastic-agent`
    volumes:
    - services-logs:/var/log/saltworks/saltminer/services
    - api-logs:/var/log/saltworks/saltminer/api
    - jobmanager-logs:/var/log/saltworks/saltminer/jobmanager
    - agent25-logs:/var/log/saltworks/saltminer-2.5.0
    - ui-api-logs:/var/log/saltworks/saltminer/ui-api
    environment:
    - FLEET_ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN}
    - FLEET_ENROLL=1
    - FLEET_URL=${FLEET_SERVER_URL}
    networks:
    - ${CONTAINER_NETWORK}
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 500mb
    depends_on:
      api:
        condition: service_healthy
      ui-api:
        condition: service_healthy
      sm-services:
        condition: service_started
      jobmanager:
        condition: service_started
    profiles:
    - fleet

volumes:
  agent25-logs:
    driver: local
  api-logs:
    driver: local
  jobmanager-logs:
    driver: local
  services-logs:
    driver: local
  smpgui-assets:
    driver: local
  ui-api-logs:
    driver: local
  ui-files:
    driver: local

networks:
  saltminer:
    driver: bridge
