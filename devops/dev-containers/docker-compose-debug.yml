# docker-compose-debug.yml
# Debug environment override — extends docker-compose-local.yml.
#
# Usage (run from /opt/saltminer-dev/saltminer-setup):
#   docker compose \
#     -f docker-compose-local.yml \
#     -f devops/dev-containers/docker-compose-debug.yml \
#     up -d
#
# Or use the Flask orchestration API at http://localhost:8080
#
# ES/Kibana are NOT touched — they run from docker-compose-local.yml unchanged.
# The 5 .NET services and smpgui are replaced with debug variants.
# Note: Manager and SyncAgent are declarative tools and run locally on the workstation
# for direct debugging while calling remote APIs.

services:
  api:
    image: saltminer-api-debug:latest
    # container_name stays "api" (inherited) — required for vsdbg docker exec
    volumes:
      # Bind-mount source for vsdbg symbol resolution (read-only)
      - /opt/saltminer-dev/saltminer:/src:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_ENABLE_DIAGNOSTICS=1

  ui-api:
    image: saltminer-ui-api-debug:latest
    # container_name stays "ui-api" (inherited)
    volumes:
      - /opt/saltminer-dev/saltminer:/src:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_ENABLE_DIAGNOSTICS=1

  sm-services:
    image: saltminer-sm-services-debug:latest
    # Hybrid build: compiles ServiceManager from Debug source but layers on production base
    # (production base has Python integration, custom scripts, and other dependencies)
    # container_name stays "services" (inherited)
    volumes:
      # Production configuration mounts (from original docker-compose-local.yml)
      - type: bind
        source: /etc/saltworks/saltminer/agent/SourceConfigs
        target: /etc/saltworks/saltminer-3.0.0/agent/SourceConfigs
      - type: bind
        source: /etc/saltworks/saltminer/python/Elastic.json
        target: /Elastic.json
      - type: bind
        source: /etc/saltworks/saltminer/python/saltworks.key
        target: /etc/saltworks/saltminer-2.5.0/saltworks.key
      - type: bind
        source: /etc/saltworks/saltminer/python/Sources
        target: /etc/saltworks/saltminer-2.5.0/Sources
      - type: bind
        source: /etc/saltworks/saltminer/servicemanager/ServiceManagerSettings.json
        target: /etc/saltworks/saltminer-3.0.0/servicemanager/ServiceManagerSettings.json
      - type: bind
        source: /usr/share/saltworks/saltminer/python/Custom
        target: /usr/share/saltworks/saltminer-2.5.0/Custom
      - services-logs:/var/log/saltworks/saltminer-3.0.0
      - agent25-logs:/var/log/saltworks/saltminer-2.5.0
      - type: bind
        source: /etc/saltworks/saltminer/manager/ManagerSettings.json
        target: /etc/saltworks/saltminer-3.0.0/manager/ManagerSettings.json
      # Debug: bind-mount source for vsdbg symbol resolution (read-only)
      - /opt/saltminer-dev/saltminer:/src:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_ENABLE_DIAGNOSTICS=1
      - ELASTIC_URL=${ELASTICSEARCH_URL}
      - ELASTIC_PWD=${ELASTIC_PASSWORD}

  jobmanager:
    image: saltminer-jobmanager-debug:latest
    # container_name stays "jobmanager" (inherited)
    volumes:
      - /opt/saltminer-dev/saltminer:/src:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_ENABLE_DIAGNOSTICS=1

  smpgui:
    # Vite dev server with HMR: runs Vue.js frontend from source
    # Each code change triggers live-reload in the browser (no rebuild/restart needed)
    image: node:20-alpine
    container_name: smpgui
    working_dir: /app
    volumes:
      # Bind-mount Vue.js source so Vite HMR picks up live edits
      # TODO: Verify this path matches the Vue.js project root in saltminer
      - /opt/saltminer-dev/saltminer/src/SaltMiner.Ui:/app
    ports:
      - "5173:5173"
      - "9229:9229"
    environment:
      # Force polling-based file watch (required in Docker bind mounts on some hosts)
      - CHOKIDAR_USEPOLLING=true
      - VITE_DEV_SERVER_PORT=5173
    entrypoint: []
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: "no"
    depends_on: []
    networks:
      - ${CONTAINER_NETWORK}
